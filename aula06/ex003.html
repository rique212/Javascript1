<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primerio programa</title>
    <style>
        body{
            background-color: rgb(71, 71, 201);
            color: white;
            font: normal 25pt Arial;
        }
        
    </style>
</head>
<body>
    <h1>Olá, mundo</h1>
    <p>Meu nome é Henrique</p>

    <script>
        var n1 = Number(prompt('Digite um número: '))
        var n2 = Number(prompt('Digite outro número: '))

        var s = Number(n1 + n2)

        alert('Sua soma é ' + s)

    </script>
</body>
</html>
