<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        var nome = prompt('Qual é seu nome? ')
        document.write(`Seu nome tem ${nome.length} letras <br/>`)
        document.write(`Seu nome em maióculos é ${nome.toUpperCase()} <br/>`)
        document.write(`Seu nome em minusculos é ${nome.toLowerCase()}`)
    </script>
    
</body>
</html>
